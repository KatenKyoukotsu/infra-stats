x-common: &common
  labels:
    logging: "true"
  restart: unless-stopped
  security_opt:
    - "no-new-privileges=true"
  cap_drop:
    - ALL

volumes:
  vmdata:

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.105.0
    container_name: victoria-metrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - vmdata:/storage
      - ./configs/vm-scrape.yml:/etc/vm/scrape.yml:ro
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=12"
      - "-promscrape.config=/etc/vm/scrape.yml"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8428/health || curl -sf http://127.0.0.1:8428/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL

  infra-stats:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infra-stats
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
      - TZ=Europe/Moscow
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    volumes:
      - ./configs:/app/configs:rw
    depends_on:
      victoria-metrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
