victoria_metrics:
  url: "http://victoria-metrics:8428"
  timeout: 30s

targets:
  - name: "local-dev"
    instance: "node-exporter:9100"
    mountpoints:
      - "/var/lib"
    description: "Local dev node-exporter"

analysis:
  cpu: true
  memory: true
  disk: true
  oom: true
  periods:
    - "1d"
    - "2d"
    - "7d"

scheduler:
  analyze_cron: "0 0 * * *"
  send_cron: "0 8 * * *"

notifier:
  botx:
    enabled: true
    api_url: "https://botx.example.com/api/v4/botx/notifications/direct"
    chat_id: "${BOTX_CHAT_ID}"
    bearer_token: "${BOTX_BEARER_TOKEN}"
